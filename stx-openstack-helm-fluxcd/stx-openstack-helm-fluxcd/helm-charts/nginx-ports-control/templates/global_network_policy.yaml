{{/*
Select the Calico API group served by the cluster. Platforms deploying Calico
through the operator serve the user-facing projectcalico.org/v3 API, while
earlier platforms only expose the internal crd.projectcalico.org/v1 CRDs.
When neither is present Calico is not the CNI and the policy is skipped so
the chart still installs.
*/}}
{{- $gnpApiVersion := "" -}}
{{- if .Capabilities.APIVersions.Has "projectcalico.org/v3" -}}
{{- $gnpApiVersion = "projectcalico.org/v3" -}}
{{- else if .Capabilities.APIVersions.Has "crd.projectcalico.org/v1" -}}
{{- $gnpApiVersion = "crd.projectcalico.org/v1" -}}
{{- end -}}

{{- if and .Values.manifests.global_network_policy $gnpApiVersion -}}
{{- $http_port := .Values.global_network_policy.ingress.destination.http_port}}
{{- $https_port := .Values.global_network_policy.ingress.destination.https_port}}
---
apiVersion: {{ $gnpApiVersion }}
kind: GlobalNetworkPolicy
metadata:
  name: gnp-for-nginx-ports
spec:
  selector: "has(iftype) && iftype == 'oam'"
  order: 100
  applyOnForward: false
  types:
  - Ingress
  - Egress
  ingress:
  - action: Allow
    ipVersion: {{ .Values.global_network_policy.ingress.ipVersion }}
    protocol: {{ .Values.global_network_policy.ingress.protocol }}
    destination:
      ports: [{{$http_port}}, {{$https_port}}]
  egress:
  - action: Allow
{{- end -}}
