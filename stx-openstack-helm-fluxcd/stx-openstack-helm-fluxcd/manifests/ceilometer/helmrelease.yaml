---
apiVersion: "helm.toolkit.fluxcd.io/v2"
kind: HelmRelease
metadata:
  name: ceilometer
  labels:
    chart_group: openstack-ceilometer
spec:
  releaseName: osh-openstack-ceilometer
  chart:
    spec:
      chart: ceilometer
      version: REPLACE_HELM_CHART_VERSION
      sourceRef:
        kind: HelmRepository
        name: starlingx
  interval: 1m
  timeout: 30m
  test:
    enable: false
  # Safe to wait even though this path creates the DaemonSet rather than
  # rolling it: rabbit-init and ks-user are plain manifests, not post-upgrade
  # hooks, so the readiness wait cannot block on them.
  install:
    disableHooks: false
    disableWait: false
  upgrade:
    disableHooks: false
    disableWait: false
  dependsOn:
    - name: nova
      namespace: openstack
    - name: neutron
      namespace: openstack
    - name: heat
      namespace: openstack
  valuesFrom:
    - kind: Secret
      name: ceilometer-static-overrides
      valuesKey: ceilometer-static-overrides.yaml
    - kind: Secret
      name: ceilometer-system-overrides
      valuesKey: ceilometer-system-overrides.yaml
...
