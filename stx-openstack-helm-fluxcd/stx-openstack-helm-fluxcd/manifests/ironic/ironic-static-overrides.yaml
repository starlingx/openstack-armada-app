---
release_group: osh-openstack-ironic

labels:
  isApplication: false
  api:
    node_selector_key: openstack-ironic
    node_selector_value: enabled
  conductor:
    node_selector_key: openstack-ironic
    node_selector_value: enabled
  job:
    node_selector_key: openstack-ironic
    node_selector_value: enabled
images:
  tags:
    bootstrap: docker.io/starlingx/stx-heat:@IMAGE_PREFIX@-@OS@-@OS_CODENAME@-@OS_ARCH@-@BUILD_STREAM@-@IMAGE_SUFFIX@
    db_drop: docker.io/starlingx/stx-heat:@IMAGE_PREFIX@-@OS@-@OS_CODENAME@-@OS_ARCH@-@BUILD_STREAM@-@IMAGE_SUFFIX@
    db_init: docker.io/starlingx/stx-heat:@IMAGE_PREFIX@-@OS@-@OS_CODENAME@-@OS_ARCH@-@BUILD_STREAM@-@IMAGE_SUFFIX@
    dep_check: quay.io/airshipit/kubernetes-entrypoint:7a6a594d2efec8b402ad970d18906863b2f04d4f-ubuntu_noble
    image_repo_sync: null
    ironic_api: docker.io/starlingx/stx-ironic:@IMAGE_PREFIX@-@OS@-@OS_CODENAME@-@OS_ARCH@-@BUILD_STREAM@-@IMAGE_SUFFIX@
    ironic_conductor: docker.io/starlingx/stx-ironic:@IMAGE_PREFIX@-@OS@-@OS_CODENAME@-@OS_ARCH@-@BUILD_STREAM@-@IMAGE_SUFFIX@
    ironic_db_sync: docker.io/starlingx/stx-ironic:@IMAGE_PREFIX@-@OS@-@OS_CODENAME@-@OS_ARCH@-@BUILD_STREAM@-@IMAGE_SUFFIX@
    ironic_manage_cleaning_network: docker.io/starlingx/stx-heat:@IMAGE_PREFIX@-@OS@-@OS_CODENAME@-@OS_ARCH@-@BUILD_STREAM@-@IMAGE_SUFFIX@
    ironic_pxe: docker.io/starlingx/stx-ironic:@IMAGE_PREFIX@-@OS@-@OS_CODENAME@-@OS_ARCH@-@BUILD_STREAM@-@IMAGE_SUFFIX@
    ironic_pxe_http: docker.io/nginx:1.13.3
    ironic_pxe_init: docker.io/starlingx/stx-ironic:@IMAGE_PREFIX@-@OS@-@OS_CODENAME@-@OS_ARCH@-@BUILD_STREAM@-@IMAGE_SUFFIX@
    ironic_retrive_cleaning_network: docker.io/starlingx/stx-heat:@IMAGE_PREFIX@-@OS@-@OS_CODENAME@-@OS_ARCH@-@BUILD_STREAM@-@IMAGE_SUFFIX@
    ironic_retrive_swift_config: docker.io/starlingx/stx-heat:@IMAGE_PREFIX@-@OS@-@OS_CODENAME@-@OS_ARCH@-@BUILD_STREAM@-@IMAGE_SUFFIX@
    ks_endpoints: docker.io/starlingx/stx-heat:@IMAGE_PREFIX@-@OS@-@OS_CODENAME@-@OS_ARCH@-@BUILD_STREAM@-@IMAGE_SUFFIX@
    ks_service: docker.io/starlingx/stx-heat:@IMAGE_PREFIX@-@OS@-@OS_CODENAME@-@OS_ARCH@-@BUILD_STREAM@-@IMAGE_SUFFIX@
    ks_user: docker.io/starlingx/stx-openstackclients:@IMAGE_PREFIX@-@OS@-@OS_CODENAME@-@OS_ARCH@-@BUILD_STREAM@-@IMAGE_SUFFIX@
    pre_apply_cleanup: docker.io/starlingx/stx-vault-manager:@IMAGE_PREFIX@-@OS@-@OS_CODENAME@-@OS_ARCH@-@BUILD_STREAM@-@IMAGE_SUFFIX@
    rabbit_init: docker.io/library/rabbitmq:3.11.28-management
  pull_policy: IfNotPresent
  local_registry:
    active: false
    exclude:
    - dep_check
    - image_repo_sync
conf:
  paste:
    override: null
    append: null
  policy: {}
  tftp_map_file: |
    re ^(/tftpboot/) /tftpboot/\2
    re ^/tftpboot/ /tftpboot/
    re ^(^/) /tftpboot/\1
    re ^([^/]) /tftpboot/\1

  nginx: |
    user  nginx;
    worker_processes  1;
    error_log  /var/log/nginx/error.log warn;
    pid        /var/run/nginx.pid;
    events {
        worker_connections  1024;
    }
    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';
        access_log  /var/log/nginx/access.log  main;
        sendfile        on;
        #tcp_nopush     on;
        keepalive_timeout  65;
        #gzip  on;
        server {
          listen       OSH_PXE_IP:{{ tuple "baremetal" "internal" "pxe_http" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }};
          server_name  localhost;
          #charset koi8-r;
          #access_log  /var/log/nginx/host.access.log  main;
          location / {
              root   /var/lib/openstack-helm/httpboot;
          }
        }
    }

  ironic:
    DEFAULT:
      # enabled_drivers is deprecated in stein
      enabled_drivers: ''
      enabled_hardware_types: ipmi
      enabled_bios_interfaces: no-bios
      enabled_boot_interfaces: pxe,ipxe
      enabled_console_interfaces: ipmitool-socat
      enabled_deploy_interfaces: iscsi,direct
      enabled_inspect_interfaces: no-inspect
      enabled_management_interfaces: ipmitool
      enabled_network_interfaces: flat,noop
      enabled_power_interfaces: ipmitool
      enabled_raid_interfaces: no-raid
      enabled_storage_interfaces: cinder,noop
      enabled_vendor_interfaces: ipmitool,no-vendor
      log_config_append: /etc/ironic/logging.conf
      tempdir: /var/lib/openstack-helm/tmp
    api:
      port: 6385
    conductor:
      api_url: null
    database:
      connection: ''
      max_retries: -1
    deploy:
      http_root: /var/lib/openstack-helm/httpboot
    nova:
      auth_type: password
    cinder:
      auth_type: password
    glance:
      glance_host: glance.openstack.svc.cluster.local
      glance_port: 80
      auth_url: http://keystone.openstack.svc.cluster.local:80/v3
      auth_type: password
      swift_temp_url_duration: 86400
      temp_url_endpoint_type: swift
      swift_container: glance
      swift_api_version: v1
      auth_section: glance
    inspector:
      auth_url: http://keystone.openstack.svc.cluster.local:80/v3
      auth_type: password
    keystone_authtoken:
      auth_uri: http://keystone.openstack.svc.cluster.local:80/v3
      auth_url: http://keystone.openstack.svc.cluster.local:80/v3
      service_token_roles: service
      service_token_roles_required: true
      auth_type: password
      auth_version: v3
    neutron:
      url: http://neutron.openstack.svc.cluster.local:80/
      auth_url: http://keystone.openstack.svc.cluster.local:80/v3
      auth_type: password
    pxe:
      pxe_append_params: "nofb nomodeset vga=normal console=ttyS0,115200n8"
      images_path: /var/lib/openstack-helm/ironic/images
      instance_master_path: /var/lib/openstack-helm/ironic/master_images
      pxe_config_template: $pybasedir/drivers/modules/ipxe_config.template
      uefi_pxe_config_template: $pybasedir/drivers/modules/ipxe_config.template
      tftp_root: /var/lib/openstack-helm/tftpboot
      tftp_master_path: /var/lib/openstack-helm/tftpboot/master_images
      pxe_bootfile_name: undionly.kpxe
      uefi_pxe_bootfile_name: ipxe.efi
      ipxe_enabled: true
    service_catalog:
      auth_type: password
    service_user:
      auth_type: password
      send_service_user_token: true
    swift:
      auth_url: null
    oslo_policy:
      policy_file: /etc/ironic/policy.yaml
    oslo_concurrency:
      lock_path: /var/lock
    dhcp:
      dhcp_provider: neutron
  logging:
    loggers:
      keys:
      - root
      - ironic
    handlers:
      keys:
      - stdout
      - stderr
      - 'null'
    formatters:
      keys:
      - context
      - default
    logger_root:
      handlers: 'null'
      level: WARNING
    logger_ironic:
      handlers:
      - stdout
      level: INFO
      qualname: ironic
    logger_amqp:
      handlers: stderr
      level: WARNING
      qualname: amqp
    logger_amqplib:
      handlers: stderr
      level: WARNING
      qualname: amqplib
    logger_eventletwsgi:
      handlers: stderr
      level: WARNING
      qualname: eventlet.wsgi.server
    logger_sqlalchemy:
      handlers: stderr
      level: WARNING
      qualname: sqlalchemy
    logger_boto:
      handlers: stderr
      level: WARNING
      qualname: boto
    handler_null:
      args: ()
      class: logging.NullHandler
      formatter: default
    handler_stdout:
      args: (sys.stdout,)
      class: StreamHandler
      formatter: context
    handler_stderr:
      args: (sys.stderr,)
      class: StreamHandler
      formatter: context
    formatter_context:
      class: oslo_log.formatters.ContextFormatter
      datefmt: '%Y-%m-%d %H:%M:%S'
    formatter_default:
      datefmt: '%Y-%m-%d %H:%M:%S'
      format: '%(message)s'
  ironic_api_uwsgi:
    uwsgi:
      add-header: 'Connection: close'
      buffer-size: 65535
      die-on-term: true
      enable-threads: true
      exit-on-reload: false
      hook-master-start: unix_signal:15 gracefully_kill_them_all
      lazy-apps: true
      log-x-forwarded-for: true
      master: true
      module: ironic.wsgi:application
      procname-prefix-spaced: 'ironic-api:'
      route-user-agent: '^kube-probe.* donotlog:'
      thunder-lock: true
      worker-reload-mercy: 80
# Disable ipa image downloading during bootstrap
conductor:
  extraContainers: []
  initContainers: []
  http:
    enabled: true
    init_script: |
      #!/bin/bash
      set -ex
      if [ "x" == "x${PROVISIONER_INTERFACE}" ]; then
        echo "Provisioner interface is not set"
        exit 1
      fi

      function net_pxe_addr {
       ip addr | awk "/inet / && /${PROVISIONER_INTERFACE}/{print \$2; exit }"
      }
      function net_pxe_ip {
       echo $(net_pxe_addr) | awk -F '/' '{ print $1; exit }'
      }
      PXE_IP=$(net_pxe_ip)

      if [ "x" == "x${PXE_IP}" ]; then
        echo "Could not find IP for pxe to bind to"
        exit 1
      fi

      sed "s|OSH_PXE_IP|${PXE_IP}|g" /etc/nginx/nginx.conf > /tmp/pod-shared/nginx.conf
    script: |
      #!/bin/bash
      set -ex
      mkdir -p /var/lib/openstack-helm/httpboot
      cp -v /tmp/pod-shared/nginx.conf /etc/nginx/nginx.conf
      exec nginx -g 'daemon off;'

  pxe:
    enabled: true
    init_script: |
      #!/bin/bash
      set -ex
      # default to Ubuntu path
      FILEPATH=${FILEPATH:-/usr/lib/ipxe}

      mkdir -p /var/lib/openstack-helm/tftpboot
      mkdir -p /var/lib/openstack-helm/tftpboot/master_images

      for FILE in undionly.kpxe ipxe.efi pxelinux.0 snponly.efi; do
        # copy in default file
        if [ -f $FILEPATH/$FILE ]; then
          cp -v $FILEPATH/$FILE /var/lib/openstack-helm/tftpboot
        fi

      done
    script: |
      #!/bin/bash
      set -ex
      function net_pxe_addr {
       ip addr | awk "/inet / && /${PROVISIONER_INTERFACE}/{print \$2; exit }"
      }
      function net_pxe_ip {
       echo $(net_pxe_addr) | awk -F '/' '{ print $1; exit }'
      }
      PXE_IP=$(net_pxe_ip)

      if [ "x" == "x${PXE_IP}" ]; then
        echo "Could not find IP for pxe to bind to"
        exit 1
      fi

      ln -s /var/lib/openstack-helm/tftpboot /tftpboot
      exec /usr/sbin/in.tftpd \
        --verbose \
        --foreground \
        --user root \
        --address ${PXE_IP}:69 \
        --map-file /tftp-map-file /tftpboot
