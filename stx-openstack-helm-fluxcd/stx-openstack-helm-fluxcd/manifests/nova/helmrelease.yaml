---
apiVersion: "helm.toolkit.fluxcd.io/v2"
kind: HelmRelease
metadata:
  name: nova
  labels:
    chart_group: openstack-nova
spec:
  releaseName: osh-openstack-nova
  chart:
    spec:
      chart: nova
      version: REPLACE_HELM_CHART_VERSION
      sourceRef:
        kind: HelmRepository
        name: starlingx
  interval: 1m
  timeout: 30m
  test:
    enable: false
  # This release is deliberately left as it is, and the reason is recorded so
  # that a future change does not scale it without addressing it first.
  #
  # disableWait must stay true. nova-db-sync and nova-rabbit-init are
  # post-install/post-upgrade Helm hooks, and nova-compute's init container lists
  # both as kubernetes-entrypoint dependencies (nova/values.yaml, under
  # dependencies.static.compute). Helm runs the readiness wait before the
  # post-upgrade hook phase, so with disableWait: false the new nova-compute pods
  # block on jobs Helm has not created yet while Helm blocks on those pods. The
  # release then deadlocks until the timeout above. This is scale-independent and
  # would deadlock on a single-node system.
  #
  # Tracked at https://bugs.launchpad.net/starlingx/+bug/2166534
  install:
    disableHooks: false
    disableWait: true
  upgrade:
    disableHooks: false
    disableWait: true
  # libvirt must not be listed here, even though nova-compute's init container
  # waits on a same-host libvirt pod (dependencies.static.compute.pod with
  # requireSameNode: true in nova/values.yaml). When nova instance storage is
  # backed by a PVC (storage_conf.pvc.enabled), the libvirt DaemonSet mounts the
  # nova-instances PVC, and that PVC is created by this release. libvirt also
  # waits for its DaemonSet, so ordering nova behind libvirt deadlocks: libvirt
  # pods stay Pending on a PVC that nova has not been allowed to create yet.
  # Leaving the edge out lets nova create the PVC while libvirt is still
  # reconciling. The two releases then settle on their own, because the init
  # container wait is per-pod and retries rather than failing.
  #
  # Tracked at https://bugs.launchpad.net/starlingx/+bug/2168755
  dependsOn:
    - name: placement
      namespace: openstack
  valuesFrom:
    - kind: Secret
      name: nova-static-overrides
      valuesKey: nova-static-overrides.yaml
    - kind: Secret
      name: nova-system-overrides
      valuesKey: nova-system-overrides.yaml
...
