platform_path: /opt/platform
restore_openstack_in_progress_flag: "{{ platform_path }}/.restore_openstack_in_progress"
restore_openstack_continue_flag: "{{ platform_path }}/.restore_openstack_continue"
kube_config_dir: /etc/kubernetes/admin.conf
mariadb_pod: mariadb-server-0
# Absolute path to the helm-overrides merge helper shipped inside this
# application bundle. Resolved through the stable 'current' symlink so the
# restore tasks do not depend on the platform playbook working directory.
merge_user_overrides_script: >-
  /opt/platform/ansible/{{ software_version }}/{{ openstack_app_name }}/current/backup-restore/roles/restore-openstack/files/merge_user_overrides.py
